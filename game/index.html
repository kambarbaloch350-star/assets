<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#170a30" />
    <meta name="description" content="جادوی اعداد — بازی پازل پاسور ریاضی ایرانی" />
    <title>جادوی اعداد</title>

    <link rel="preload" href="./fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Vazirmatn-Black.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* splash — shown until the bundle boots */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: linear-gradient(170deg, #241145 0%, #170a30 46%, #0e0620 100%);
        transition: opacity 0.5s ease, visibility 0.5s;
        font-family: system-ui, sans-serif;
      }
      #splash.is-gone {
        opacity: 0;
        visibility: hidden;
      }
      .sp-box {
        text-align: center;
      }
      .sp-med {
        width: 118px;
        height: 118px;
        margin: 0 auto 18px;
        border-radius: 34%;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 34% 28%, #a678ff, #6d3bd4 42%, #3d1a86);
        border: 5px solid #f9c440;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        font-size: 30px;
        font-weight: 900;
        color: #ffe08a;
        animation: spb 1.6s ease-in-out infinite;
      }
      @keyframes spb {
        50% {
          transform: translateY(-9px) scale(1.04);
        }
      }
      .sp-t {
        font-size: 27px;
        font-weight: 900;
        color: #f9c440;
        letter-spacing: -0.5px;
      }
      .sp-s {
        font-size: 12px;
        color: #2fd9c5;
        margin-top: 5px;
      }
      .sp-bar {
        width: 150px;
        height: 4px;
        margin: 20px auto 0;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .sp-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #2fd9c5, #f9c440);
        animation: spl 1.1s ease-in-out infinite;
      }
      @keyframes spl {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(340%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="splash">
      <div class="sp-box">
        <div class="sp-med">۷×۸</div>
        <div class="sp-t">جادوی اعداد</div>
        <div class="sp-s">پاسور ریاضی ایرانی</div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
